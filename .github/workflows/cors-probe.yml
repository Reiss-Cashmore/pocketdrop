name: CORS probe (spike)
on:
  push:
    branches: ["spike/**"]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-26.04
    steps:
      - name: Which clients still accept device-code login
        run: |
          for c in web:kimne78kx3ncx6brgo4mv6wki5h1ko mobile_web:r8s4dac0uhzifbpu9sjdiwzctle17ff android_app:kd1unb4b3q4t58fwlpcbzcbnm76a8fp smart_tv:ue6666qo983tsx6so1t0vnawi233wa; do
            name=${c%%:*}; id=${c##*:}
            out=$(curl -s -w ' HTTP%{http_code}' -X POST https://id.twitch.tv/oauth2/device \
              -H 'Content-Type: application/x-www-form-urlencoded' --data "client_id=$id&scopes=")
            # Show the status and field names only, not the codes themselves.
            summary=$(echo "$out" | python3 -c "import sys,json,re;t=sys.stdin.read();b,s=t.rsplit(' ',1);d=json.loads(b) if b.strip().startswith('{') else {};print(s, sorted(d) if 'device_code' in d else d)")
            echo "::notice title=device login: $name::$summary"
          done
