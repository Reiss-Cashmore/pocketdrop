name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      # Surface compiler/build errors as annotations, readable without downloading logs.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DropSpike-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DropSpike-apk
          path: DropSpike-*.apk

      # Push a tag like v0.1.0 to publish a release (Obtainium can track these).
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DropSpike-*.apk
