name: Build APK

on:
  push:
    branches: [main]
    # Docs-only changes don't change the app, so they don't build or publish a release.
    paths-ignore: ["**.md", "docs/**", "art/**", "LICENSE"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, for the release notes

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Also validates the Gradle wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6

      # Sign with your private key when the repo has the signing secrets (README "Signing").
      - name: Private signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the private key"
          else
            echo "::notice::Signed with the public test key. Add the signing secrets (README, Signing) to use your own."
          fi

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --warning-mode=all 2>&1 | tee build.log

      # Surface compiler and Gradle warnings/errors as annotations, readable without the logs.
      - name: Report build problems
        if: always()
        run: |
          [ -f build.log ] || exit 0
          grep -E "^w: |^Warning: |[Dd]eprecated Gradle features|is deprecated" build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::warning::${line}"
          done
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      # Known-vulnerability scan of every resolved library (direct and transitive) against OSV.
      - name: Resolve dependency tree
        run: ./gradlew buildEnvironment :app:dependencies --write-locks --quiet > /dev/null

      - name: Scan dependencies (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=osv.json
            --lockfile=app/gradle.lockfile
            --lockfile=buildscript-gradle.lockfile

      - name: Report vulnerabilities
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          if not os.path.exists("osv.json"):
              print("::warning::Vulnerability scan produced no report"); raise SystemExit
          # Which Gradle configurations pull each library in (from the lockfile).
          configs = {}
          for lockfile in ("app/gradle.lockfile", "buildscript-gradle.lockfile"):
              for line in open(lockfile):
                  if "=" in line and not line.startswith("#"):
                      coord, confs = line.strip().split("=", 1)
                      configs.setdefault(coord, []).extend(confs.split(","))
          in_apk = tooling = 0
          for r in json.load(open("osv.json")).get("results", []):
              for p in r.get("packages", []):
                  pkg = p["package"]
                  confs = configs.get(f"{pkg['name']}:{pkg['version']}", [])
                  shipped = [c for c in confs if c.startswith("release") and "RuntimeClasspath" in c]
                  for v in p.get("vulnerabilities", []):
                      sev = (v.get("database_specific") or {}).get("severity", "?")
                      text = f"{pkg['name']}@{pkg['version']}: {v['id']} ({sev}) {v.get('summary', '')}"
                      if shipped:
                          in_apk += 1
                          print(f"::error::In the APK: {text}")
                      else:
                          tooling += 1
                          print(f"::warning::Build tooling only ({', '.join(confs[:3])}): {text}")
          print(f"::notice::OSV scan: {in_apk} known vulnerabilities in the APK, {tooling} in build-time tooling")
          PY

      # versionName is 0.1.<run number> (app/build.gradle.kts); the tag and file name match it.
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PocketDrop-0.1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v7
        with:
          name: PocketDrop-apk
          path: PocketDrop-*.apk

      # Every build of main becomes a GitHub release, which Obtainium installs automatically.
      # Only builds signed with the private key are published, never the public test key.
      - name: Release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_STORE_FILE != ''
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## Changes"
            git log ${previous:+$previous..}HEAD --no-merges --format='- %s' | grep -v '^- Merge ' | head -40
            echo
            echo "Signed with the PocketDrop release key. Install with [Obtainium](https://github.com/ImranR98/Obtainium) to get updates automatically."
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_STORE_FILE != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: PocketDrop 0.1.${{ github.run_number }}
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: PocketDrop-*.apk

  # Sends the resolved dependency tree (including transitive ones) to GitHub, so Dependabot
  # alerts cover every library in the APK, not just the ones named in the version catalog.
  dependencies:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/dependency-submission@v6
